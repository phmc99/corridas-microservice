services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mysql://corridas:corridas_teste@mysql:3306/corridas
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://mongodb:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Se perder a conexão com o RabbitMQ, o worker sai e o Docker sobe de novo.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: corridas
      MYSQL_USER: corridas
      MYSQL_PASSWORD: corridas_teste
      MYSQL_ROOT_PASSWORD: root_teste
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucorridas -pcorridas_teste"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    volumes:
      - mongodb-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Recebe os traces da API e do worker por OTLP (porta 4318) e mostra em http://localhost:16686.
  # Guarda tudo em memória: os traces somem quando o container reinicia.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"

  # Teste de carga. Fica fora do `docker compose up` (profile) e roda com: docker compose run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: ["carga"]
    command: ["run", "/scripts/corridas.js"]
    volumes:
      - ./k6:/scripts:ro
      - ./apps/api/test/tokens-teste.json:/tokens/tokens-teste.json:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api
      - worker

volumes:
  mysql-dados:
  mongodb-dados:
